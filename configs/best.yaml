# configs/best.yaml
model:
  # input_dim: # set dynamically based on dataset
  hidden_layers: [64, 128] 
  activation: tanh                     
  dropout: 0.1                         
  batch_norm: true
  output_dim: 1                        # binary classification

training:
  epochs: 40                           
  batch_size: 64                       
  learning_rate: 0.0017417310784954333
  optimizer: adam                     
  device: cuda   
  early_stopping:
    patience: 8
    counter: 0                      

experiment:
  group: "sweep-01-best"               
  name: "mlp_bioresponse_best"
  output_dir: "results/"
  log_interval: 10