# configs/best.yaml
model:
  # input_dim: # set dynamically based on dataset
  hidden_layers: [512, 256, 128, 64]   
  activation: relu                     
  dropout: 0.2                         
  batch_norm: true
  output_dim: 1                        # binary classification

training:
  epochs: 40                           
  batch_size: 64                       
  learning_rate: 0.0008265606408622951 
  optimizer: adamw                     
  device: cuda                         

experiment:
  group: "sweep-01-best"               
  name: "mlp_bioresponse_best"
  output_dir: "results/"
  log_interval: 10